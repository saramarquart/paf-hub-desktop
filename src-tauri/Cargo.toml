[package]
name = "paf-hub-desktop"
version = "0.2.0"
description = "Desktop window for the Planet A Foods app hub"
authors = ["Planet A Foods"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "paf_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE: the `unstable` feature is REQUIRED for the multi-webview tab support.
# It unlocks `WindowBuilder`/`Window` (a bare window we attach children to),
# `Window::add_child`, and the `WebviewBuilder`/`Webview` multiwebview APIs used
# by src/lib.rs. Without it the crate will not expose those symbols and the
# build fails. This changes the build (opt-in to Tauri's unstable API surface).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
