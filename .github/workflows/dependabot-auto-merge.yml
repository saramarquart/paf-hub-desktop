# Auto-merge Dependabot PRs that bump PATCH versions only, and only once the
# CI workflow (ci.yml) has passed on the PR's exact head commit.
#
# - Minor and major updates are never merged here; they wait for a human.
# - GitHub Actions updates are skipped (GITHUB_TOKEN cannot merge workflow changes).
# - The merge pins the head SHA, so a commit pushed after CI ran is never merged unseen.
# - A merge made with GITHUB_TOKEN does not trigger other workflows' `push` runs.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository_owner == 'saramarquart'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read          # read the CI run for the head commit
      contents: write        # merge
      pull-requests: write   # merge
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          SKIP_DIRECTORIES: ""
        run: |
          eligible=true
          if [ "$UPDATE_TYPE" != "version-update:semver-patch" ]; then
            echo "Not a patch-only update ($UPDATE_TYPE): leaving it for review."; eligible=false
          elif [ "$ECOSYSTEM" = "github_actions" ]; then
            echo "GitHub Actions update: leaving it for review."; eligible=false
          else
            for d in $SKIP_DIRECTORIES; do
              if [ "$DIRECTORY" = "$d" ]; then echo "Directory $d is excluded from auto-merge."; eligible=false; fi
            done
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Wait for CI on the head commit
        if: steps.decide.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CI_WORKFLOW: ci.yml
        run: |
          for _ in $(seq 1 90); do
            state=$(gh api "repos/$REPO/actions/workflows/$CI_WORKFLOW/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") echo "CI passed on $SHA."; exit 0 ;;
              completed*) echo "::error::CI did not pass on $SHA ($state); not merging."; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for CI on $SHA; not merging."
          exit 1

      - name: Merge
        if: steps.decide.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_URL" --squash --match-head-commit "$SHA"
