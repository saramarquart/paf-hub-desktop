# Checks that the app still compiles and the npm tooling has no high/critical
# advisories. Releases are built separately by release.yml (on a version tag).
# Also the CI gate for .github/workflows/dependabot-auto-merge.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
      - name: Install npm tooling
        run: npm ci
      - name: Audit npm dependencies (high and critical)
        run: npm audit --audit-level=high
      - name: Linux build dependencies for Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      # The runner's preinstalled stable Rust; no third-party toolchain action needed.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
