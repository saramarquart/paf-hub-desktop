name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# CI then builds the macOS .dmg and Windows .exe/.msi and attaches them to a
# GitHub Release for download. workflow_dispatch allows a manual test build.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # universal .dmg (Apple Silicon + Intel)
            args: "--target universal-apple-darwin"
          - platform: windows-latest    # .exe (NSIS) + .msi
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # "true" when the Windows signing secrets are set. A step's `if` can't see
      # that step's own `env`, so the check lives here at job level.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm install

      # --- Windows code signing -------------------------------------------------
      # If the two repo secrets below are set, import the self-signed .pfx into the
      # runner's certificate store and tell Tauri to sign with it (by thumbprint).
      # See SIGNING.md for how to create the cert and add the secrets. When the
      # secrets are absent, the step is skipped and Windows builds ship unsigned.
      - name: Import Windows signing certificate
        id: winsign
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Remove-Item $pfxPath -Force

      - name: Build app + publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri picks up this env var and signs the NSIS/MSI bundle with the
          # imported cert. Empty on macOS / when no cert secret is configured.
          TAURI_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.winsign.outputs.thumbprint }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Planet A Foods ${{ github.ref_name }}"
          releaseBody: |
            **Planet A Foods**: the app hub as a desktop app. One window with tabs
            for all internal tools (QOaroma, paf_note, paf_feedback, paf_training,
            paf_commodity, paf_coa, finance, paf_force, paf_freight,
            paf_supplychain). Sign-in runs in your web browser, then you're back
            in the app. Personio, Moss and Ariadne open in your browser.

            **Which file?**
            - Mac: the `.dmg` (or the `.pkg` if IT installs it for you).
            - Windows: the `_x64-setup.exe` (the `.msi` is for IT).

            **Mac, first time only:** drag **Planet A Foods** to **Applications**,
            then open **Terminal** and paste
            `sudo xattr -dr com.apple.quarantine "/Applications/Planet A Foods.app"`
            (enter your Mac password). After that it opens like any other app.

            **Windows:** if you see "Windows protected your PC", click
            **More info → Run anyway** (once).

            Full guide: [README](https://github.com/saramarquart/paf-hub-desktop#install-and-first-launch).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # --- macOS .pkg for MDM deployment ---------------------------------------
      # Tauri emits .app + .dmg but no .pkg. MDMs (Jamf/Kandji/Mosyle/Intune)
      # deploy a .pkg to /Applications silently, and — because MDM-managed
      # installs don't set com.apple.quarantine — the Gatekeeper prompt our
      # self-signed .app triggers on manual download does NOT appear. So we wrap
      # the freshly-built universal .app with `productbuild` and attach the .pkg
      # to the same release. It is UNSIGNED (no Developer ID Installer cert);
      # supervised MDM installs accept that. To sign later, set a
      # `Developer ID Installer` cert and add `--sign "<identity>"`.
      - name: Build macOS .pkg (MDM)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target -type d -name "Planet A Foods.app" -path "*bundle/macos*" | head -n1)
          if [ -z "$APP" ]; then echo "::error::built .app not found"; exit 1; fi
          echo "Wrapping: $APP"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG="Planet-A-Foods_${VERSION}_universal.pkg"
          productbuild --component "$APP" /Applications "$PKG"
          echo "Built $PKG"
          gh release upload "$GITHUB_REF_NAME" "$PKG" --clobber
